<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        height: 100%;
        overflow: hidden;
    }
    main{
        align-items: center;
        display: flex;
        height: 100vh;
        justify-content: center
    }
    #takematsu{
        display: flex;
        background-color: red;
        width: 100px;
        height: 100px;
        justify-content: center;
        align-items: center
    }
    .flutuando {
        animation: flutuando-animacao 2s ease-in-out infinite;
    }
    .bloco{
        background-color: yellow;
        width: 20px;
        height: 20px;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #barra-fome-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }
    #barra-fome-container span {
        font-family: sans-serif;
        font-size: 14px;
    }
    #barra-fome-fundo {
        width: 200px;
        height: 20px;
        background-color: #333;
        border-radius: 10px;
        overflow: hidden;
    }
    #barra-fome {
        height: 100%;
        width: 100%;
        background-color: orange;
        border-radius: 10px;
        transition: width 0.3s ease, background-color 0.3s ease;
    }
    
    @keyframes flutuando-animacao {
        0% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-15px); 
        }
        100% {
            transform: translateY(0);
        }
    }

    #sushi{
        width: 80px;
        height: 80px;
    }

    #comida {
        position: fixed;
        bottom: 20px;
        left: 20px;
        cursor: grab;
    }
</style>
<body>

    <main role="main" aria-label="Área principal do jogo">
        <div
            class="zona-destino personagem"
            id="takematsu"
            role="button"
            tabindex="0"
            aria-label="Takematsu, clique para interagir"
            aria-describedby="barra-fome-label"
        >
        </div>
    </main>

    <aside
        id="barra-fome-container"
        class="hud hud-fome"
        role="status"
        aria-live="polite"
        aria-label="Status de fome do Takematsu"
    >
        <span
            id="barra-fome-label"
            class="hud-titulo"
            style="color: black;"
        >
            Fome do Takematsu
        </span>
        <div
            id="barra-fome-fundo"
            class="barra-container"
            role="progressbar"
            aria-valuenow="100"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-labelledby="barra-fome-label"
        >
            <div id="barra-fome" class="barra-preenchimento"></div>
        </div>
    </aside>

    <div
        id="comida"
        class="item-arrastavel alimento"
        draggable="true"
        role="button"
        tabindex="0"
        aria-label="Sushi, arraste até o Takematsu para alimentá-lo"
        aria-grabbed="false"
    >
        <img
            id="sushi"
            class="alimento-imagem"
            src="imgs\a7cf15d5-9ad9-4aef-b7c1-e73608b99c66-removebg-preview.png"
            alt="Sushi para alimentar o Takematsu"
            aria-hidden="true"
        >
    </div>

</body>
<script src="script.js"></script>
<script src="scriptAcessibilidade.js"></script>
</html>
